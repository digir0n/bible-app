<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible App — AFR53</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">Bible</div>

        <div class="location">
            <span id="locationText">AFR53 · GÉNESIS 1</span>
        </div>

        <button id="menuButton" class="menu-button" type="button" aria-expanded="false">
            ☰
        </button>
    </div>

    <div id="navigationPanel" class="navigation-panel">
        <section class="nav-section">
            <div class="nav-label">Vertaling</div>
            <select id="translationSelect"></select>
        </section>

        <section class="nav-section">
            <div class="nav-label">Boek</div>
            <div class="book-groups">
                <div>
                    <h2>Ou Testament</h2>
                    <div id="oldTestamentBooks" class="book-grid"></div>
                </div>
                <div>
                    <h2>Nuwe Testament</h2>
                    <div id="newTestamentBooks" class="book-grid"></div>
                </div>
            </div>
        </section>

        <section class="nav-section">
            <div class="nav-label">Hoofstuk</div>
            <div id="chapterGrid" class="number-grid"></div>
        </section>

        <section class="nav-section">
            <div class="nav-label">Vers</div>
            <div id="verseGrid" class="number-grid verse-grid"></div>
        </section>
    </div>
</header>

<main class="reader">
    <div id="status" class="status">Laai Bybel...</div>

    <section class="chapter-header">
        <div id="translationName" class="translation-name"></div>
        <h1 id="chapterTitle">GÉNESIS 1</h1>
    </section>

    <article id="verseContainer" class="verses"></article>

    <nav class="chapter-nav">
        <button id="previousButton" type="button">← Vorige</button>
        <button id="nextButton" type="button">Volgende →</button>
    </nav>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-asm.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
